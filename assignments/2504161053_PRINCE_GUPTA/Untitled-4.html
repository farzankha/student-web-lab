<!DOCTYPE html>
<html>
<head>
    <title>Character Entities</title>
</head>

<body>

<h1>HTML Character Entities</h1>

<p>Mathematical Symbols:</p>
<p>&plusmn; &times; &divide; &equals; &le; &ge;</p>

<p>Copyright and Other Symbols:</p>
<p>&copy; 2026 &reg; &trade; &euro; &dollar;</p>

<p>Quotation Marks:</p>
<p>&quot;Hello World&quot;</p>
<p>&apos;Welcome to HTML&apos;</p>

<p>Angle Brackets:</p>
<p>&lt;html&gt;</p>
<p>&lt;body&gt;</p>

<p>Ampersand:</p>
<p>HTML &amp; CSS</p>

</body>
</html>

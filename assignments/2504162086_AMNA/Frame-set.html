<!DOCTYPE html>
<html>
<head>
    <title>Modern Web Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: lightgray;
            padding: 10px;
            text-align: center;
        }

        nav a {
            margin: 15px;
            text-decoration: none;
        }

        main {
            display: flex;
            padding: 20px;
        }

        section {
            width: 70%;
            padding: 15px;
        }

        aside {
            width: 30%;
            padding: 15px;
            background-color: #eeeeee;
        }

        footer {
            background-color: lightblue;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Modern Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <main>

        <section>
            <h2>Welcome</h2>

            <article>
                <h3>About Website</h3>
                <p>
                    This is a modern webpage created using
                    semantic HTML and CSS layout.
                </p>
            </article>
        </section>

        <aside>
            <h3>Quick Links</h3>
            <p>Latest Updates</p>
            <p>Important Information</p>
        </aside>

    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>HTML Character Entities</title>
</head>
<body>

<h1>HTML Character Entities</h1>

<p>Copyright: &copy; 2026</p>

<p>Registered Trademark: &reg;</p>

<p>Trademark: &trade;</p>

<p>Less than: &lt;</p>

<p>Greater than: &gt;</p>

<p>Ampersand: &amp;</p>

<p>Quotation Mark: &quot;Hello&quot;</p>

<p>Apostrophe: &apos;Hello&apos;</p>

<p>Angle Brackets: &lt;HTML&gt;</p>

<p>Non-breaking space: Hello&nbsp;World</p>

</body>
</html>

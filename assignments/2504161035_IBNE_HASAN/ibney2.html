<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>Student Registration</title>
</head>
<body>
 <h1>Student Registration Form</h1>
 <form action="/submit-registration" method="POST"
enctype="multipart/form-data">
 <label for="name">Full Name:</label>
 <input type="text" id="name" name="name" required><br><br>
 <label for="email">Email Address:</label>
 <input type="email" id="email" name="email" required><br><br>
<label for="password">Password:</label>
 <input type="password" id="password" name="password"
minlength="8" required><br><br>
 <label>Gender:</label>
 <input type="radio" id="male" name="gender" value="male">
 <label for="male">Male</label>
 <input type="radio" id="female" name="gender" value="female">
 <label for="female">Female</label>
 <input type="radio" id="other" name="gender" value="other">
 <label for="other">Other</label><br><br>
 <label for="course">Course:</label>
 <select id="course" name="course" required>
 <option value="">-- Select Course --</option>
 <option value="bca">BCA</option>
 <option value="mca">MCA</option>
 <option value="bsc">B.Sc Computer Science</option>
 </select><br><br>
 <label for="dob">Date of Birth:</label>
 <input type="date" id="dob" name="dob" required><br><br>
 <label>Hobbies:</label>
 <input type="checkbox" id="reading" name="hobbies"
value="reading">
 <label for="reading">Reading</label>
 <input type="checkbox" id="coding" name="hobbies"
value="coding">
 <label for="coding">Coding</label>
 <input type="checkbox" id="sports" name="hobbies"
value="sports">
 <label for="sports">Sports</label><br><br>
 <label for="address">Address:</label><br>
 <textarea id="address" name="address" rows="3" cols="40">
</textarea><br><br>
 <label for="photo">Upload Photo:</label>
 <input type="file" id="photo" name="photo" accept="image/*">
<br><br>
 <input type="submit" value="Register">
 <input type="reset" value="Clear Form">
 </form>
</body>
</html>

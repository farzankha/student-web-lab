<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form action="#" method="post" enctype="multipart/form-data">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <br><br>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>

        <label for="course">Select Course:</label>
        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="BCA">BCA</option>
            <option value="BSc">B.Sc. Computer Science</option>
            <option value="MCA">MCA</option>
            <option value="MSc">M.Sc. Computer Science</option>
        </select>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label>Hobbies:</label>
        <input type="checkbox" id="reading" name="hobbies" value="Reading">
        <label for="reading">Reading</label>

        <input type="checkbox" id="music" name="hobbies" value="Music">
        <label for="music">Music</label>

        <input type="checkbox" id="sports" name="hobbies" value="Sports">
        <label for="sports">Sports</label>

        <input type="checkbox" id="photography" name="hobbies" value="Photography">
        <label for="photography">Photography</label>
        <br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="5" cols="40"
                  placeholder="Enter your address" required></textarea>
        <br><br>

        <label for="photo">Upload Photo:</label>
        <input type="file" id="photo" name="photo" accept="image/*">
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>

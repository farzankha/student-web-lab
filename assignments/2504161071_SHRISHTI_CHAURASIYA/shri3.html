<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; }
    fieldset { margin-bottom: 15px; border-radius: 6px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
    .radio-group label, .checkbox-group label { display: inline-block; font-weight: normal; margin-right: 15px; }
    button { margin-top: 15px; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>Student Registration Form</h1>
  <form action="#" method="post">
    <fieldset>
      <legend>Personal Details</legend>
      <label for="fname">Full Name</label>
      <input type="text" id="fname" name="fullname" placeholder="Enter your full name" required>
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
      <label for="pwd">Password</label>
      <input type="password" id="pwd" name="password" minlength="6" required>
      <label>Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="male"> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="other"> Other</label>
      </div>
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" required>
    </fieldset>
    <fieldset>
      <legend>Academic Details</legend>
      <label for="course">Course</label>
      <select id="course" name="course">
        <option value="bca">BCA</option>
        <option value="bsc-cs">B.Sc. Computer Science</option>
        <option value="bcom">B.Com</option>
        <option value="ba">B.A.</option>
      </select>
    </fieldset>
    <fieldset>
      <legend>Other Information</legend>
      <label>Hobbies</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>
        <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
        <label><input type="checkbox" name="hobbies" value="music"> Music</label>
        <label><input type="checkbox" name="hobbies" value="coding"> Coding</label>
      </div>
      <label for="address">Address</label>
      <textarea id="address" name="address" rows="3" placeholder="Enter your full address"></textarea>
      <label for="photo">Upload Photo</label>
      <input type="file" id="photo" name="photo" accept="image/*">
    </fieldset>
    <button type="submit">Register</button>
    <button type="reset">Reset</button>
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College Annual Day - Photo Gallery</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    .gallery { display: flex; flex-wrap: wrap; gap: 20px; }
    figure { width: 220px; margin: 0; text-align: center; }
    figure img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; border: 1px solid #ccc; }
    figcaption { font-size: 0.9em; color: #444; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Annual Day 2026 - Event Gallery</h1>
  <div class="gallery">
    <figure>
      <img src="event1.jpg" alt="Chief guest lighting the ceremonial lamp on stage during the opening ceremony">
      <figcaption>Opening Ceremony - Lamp Lighting</figcaption>
    </figure>
    <figure>
      <img src="event2.jpg" alt="Group of students performing a classical dance on stage in traditional costumes">
      <figcaption>Cultural Dance Performance</figcaption>
    </figure>
    <figure>
      <img src="event3.jpg" alt="Winning team receiving a trophy from the principal during the prize distribution">
      <figcaption>Prize Distribution - Quiz Competition</figcaption>
    </figure>
    <figure>
      <img src="event4.jpg" alt="Audience of students and faculty seated in the auditorium watching the event">
      <figcaption>Audience at the Auditorium</figcaption>
    </figure>
  </div>
</body>
</html>

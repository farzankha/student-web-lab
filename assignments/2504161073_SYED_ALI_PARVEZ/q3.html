<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q3 — Student Registration</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#1f2937;line-height:1.6}
header{background:#12355b;color:#fff;padding:24px 6%;box-shadow:0 2px 8px #0002}
header h1{margin:0 0 4px;font-size:28px}
header p{margin:0;color:#dbeafe}
nav{background:#0b253f;padding:10px 6%;position:sticky;top:0;z-index:5}
nav a{color:#fff;text-decoration:none;margin:4px 10px 4px 0;display:inline-block;padding:7px 10px;border-radius:5px}
nav a:hover{background:#1d4f7a}
main{width:min(1050px,92%);margin:28px auto}
.card{background:#fff;padding:26px;border-radius:10px;box-shadow:0 4px 16px #00000012;margin-bottom:22px}
h2{color:#12355b;margin-top:0}
h3{color:#164e78}
table{width:100%;border-collapse:collapse;background:#fff}
caption{font-size:21px;font-weight:bold;padding:12px;color:#12355b}
th,td{border:1px solid #b8c4d1;padding:11px;text-align:center}
th{background:#e8eef5}
fieldset{border:1px solid #b8c4d1;border-radius:7px;margin:16px 0;padding:15px}
label{display:block;font-weight:bold;margin:10px 0 5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #94a3b8;border-radius:5px;font:inherit}
input[type=radio],input[type=checkbox]{width:auto}
button{padding:10px 18px;border:0;border-radius:5px;background:#12355b;color:white;cursor:pointer;margin-right:8px}
button[type=reset]{background:#64748b}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
figure{margin:0;background:#f8fafc;padding:12px;border:1px solid #d7dee7;border-radius:8px}
figure svg{width:100%;height:auto;border-radius:5px}
figcaption{font-weight:bold;text-align:center;padding:9px 2px}
.notice{background:#fff7ed;border-left:5px solid #f97316;padding:13px;margin-top:20px}
.layout{display:flex;gap:20px}
aside{width:25%;background:#e8eef5;padding:20px;border-radius:8px}
.content{flex:1;background:#fff;padding:25px;border-radius:8px}
footer{background:#0b253f;color:#fff;padding:18px 6%;margin-top:30px}
code{background:#eef2f7;padding:2px 5px;border-radius:3px}
@media(max-width:700px){.layout{flex-direction:column}aside{width:100%}nav{position:static}}
</style>

</head>
<body>
<header><h1>Web Design Assignment</h1><p>HTML &amp; HTML5 — Unit II</p></header>

<nav>
<a href="index.html">Home</a>
<a href="q1.html">Q1 Profile</a>
<a href="q2.html">Q2 Timetable</a>
<a href="q3.html">Q3 Form</a>
<a href="q4.html">Q4 Gallery</a>
<a href="q5.html">Q5 Navigation</a>
<a href="q6.html">Q6 Semantic</a>
<a href="q7.html">Q7 Entities</a>
<a href="q8.html">Q8 Layout</a>
</nav>


<main>
<section class="card">
<h2>Student Registration Form</h2>
<form action="#" method="post" enctype="multipart/form-data">
<label for="name">Full Name</label>
<input type="text" id="name" name="name" required>

<label for="email">E-mail</label>
<input type="email" id="email" name="email" required>

<label for="pwd">Password</label>
<input type="password" id="pwd" name="pwd" minlength="8" required>

<fieldset><legend>Gender</legend>
<label><input type="radio" name="gender" value="male" required> Male</label>
<label><input type="radio" name="gender" value="female"> Female</label>
</fieldset>

<label for="course">Course</label>
<select id="course" name="course" required>
<option value="">Select course</option><option value="bca">BCA</option><option value="mca">MCA</option>
</select>

<label for="dob">Date of Birth</label>
<input type="date" id="dob" name="dob" required>

<fieldset><legend>Hobbies</legend>
<label><input type="checkbox" name="hobby" value="reading"> Reading</label>
<label><input type="checkbox" name="hobby" value="sports"> Sports</label>
</fieldset>

<label for="address">Address</label>
<textarea id="address" name="address" rows="4" required></textarea>

<label for="photo">Upload Photo</label>
<input type="file" id="photo" name="photo" accept="image/*">

<p><button type="submit">Submit</button><button type="reset">Reset</button></p>
</form>
</section>
</main>

<footer>© 2026 — Web Design Assignment</footer>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Accessible Image Gallery</title>
</head>

<body>

    <h1>My Image Gallery</h1>

    <p>
        Welcome to my image gallery. Each image has an accessible
        description using the alt attribute.
    </p>

    <hr>

    <h2>Nature Gallery</h2>

    <figure>
        <img src="mountain.jpg"
             alt="A tall mountain surrounded by green trees under a blue sky"
             width="300">

        <figcaption>
            Beautiful mountain landscape surrounded by nature.
        </figcaption>
    </figure>

    <figure>
        <img src="sunset.jpg"
             alt="Orange sunset over a calm lake with trees visible in the distance"
             width="300">

        <figcaption>
            A peaceful sunset over a lake.
        </figcaption>
    </figure>

    <figure>
        <img src="forest.jpg"
             alt="A green forest with tall trees and sunlight passing through the branches"
             width="300">

        <figcaption>
            Sunlight shining through a green forest.
        </figcaption>
    </figure>

    <figure>
        <img src="flowers.jpg"
             alt="Colorful pink, yellow, and purple flowers blooming in a garden"
             width="300">

        <figcaption>
            Colorful flowers blooming in a garden.
        </figcaption>
    </figure>

    <hr>

    <h2>Accessibility Information</h2>

    <p>
        The alt attribute provides a text description of each image.
        Screen readers can read this description to users who cannot
        see the images.
    </p>

</body>
</html>

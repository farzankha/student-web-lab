<!DOCTYPE html>
<head>
    <title>College Cultural Event Gallery</title>
    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        figure {
            width: 300px;
            margin: 0;
        }

        figure img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        figcaption {
            text-align: center;
            padding: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>College Cultural Event Gallery</h1>
        <p>Highlights from our annual college cultural festival.</p>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img src="opening-ceremony.jpg"
                     alt="Students and faculty attending the opening ceremony of the college cultural festival">
                <figcaption>Opening Ceremony</figcaption>
            </figure>

            <figure>
                <img src="dance-performance.jpg"
                     alt="A group of students performing a traditional dance on the college stage">
                <figcaption>Traditional Dance Performance</figcaption>
            </figure>

            <figure>
                <img src="music-performance.jpg"
                     alt="Student musicians performing on stage in front of a college audience">
                <figcaption>Music Performance</figcaption>
            </figure>

            <figure>
                <img src="prize-distribution.jpg"
                     alt="College principal presenting a trophy to a student during the prize distribution ceremony">
                <figcaption>Prize Distribution</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>

</body>
</html>

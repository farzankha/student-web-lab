<!DOCTYPE html>
<html>
<head>
    <title>HTML Character Entities</title>
</head>

<body>

    <h1>HTML Special Characters</h1>

    <p>Copyright: &copy; 2026</p>

    <p>Registered Trademark: &reg;</p>

    <p>Trademark: &trade;</p>

    <p>Less than: &lt;</p>

    <p>Greater than: &gt;</p>

    <p>Ampersand: &amp;</p>

    <p>Quotation mark: &quot;Hello World&quot;</p>

    <p>Mathematical expression: x &lt; 10</p>

    <p>Plus or minus: &plusmn;</p>

    <p>Multiplication: &times;</p>

    <p>Division: &divide;</p>

</body>
</html>

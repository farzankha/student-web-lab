<!DOCTYPE html>
<html>
<head>
    <title>Character Entities</title>
</head>
<body>
    <h2>Special Characters in HTML</h2>

    <p>Less than: &lt;</p>
    <p>Greater than: &gt;</p>

    <p>Ampersand: &amp;</p>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>College Gallery</title>
</head>

<body>
    <h1>Annual College Fest 2026 - Highlights</h1>

    <main class="gallery-grid">

        <!-- Image 1 -->
        <figure>
            <img src="https://unsplash.com"
                 alt="A wide view of a crowded college auditorium during a keynote speech with a presenter on stage.">

            <figcaption>
                <strong>Inauguration Ceremony</strong>
                The opening remarks by our chief guest at the main auditorium kicked off the annual festival.
            </figcaption>
        </figure>

        <!-- Image 2 -->
        <figure>
            <img src="https://unsplash.com"
                 alt="Students sitting at tables outdoors painting colourful canvases.">

            <figcaption>
                <strong>Fine Arts Competition</strong>
                Participants showcasing their creativity.
            </figcaption>
        </figure>

        <!-- Image 3 -->
        <figure>
            <img src="https://unsplash.com"
                 alt="A rock band performing live under bright purple stage lights.">

            <figcaption>
                <strong>Battle of the Bands</strong>
                The rock music finale performance that brings the energy to the crowd.
            </figcaption>
        </figure>

    </main>
</body>
</html>

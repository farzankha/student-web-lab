<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body>
    <h1>Registration Form</h1>
    <br>

    <label>
        Enter Your Name:
        <input type="text" name="Name">
    </label>
    <br>

    <label>
        Enter Email-ID:
        <input type="email" name="Email-ID">
    </label>
    <br>

    <label>
        Enter Password:
        <input type="password" name="Password">
    </label>
    <br>

    <p>Gender</p>

    <label for="F">
        Female
        <input type="radio" value="Female" name="Gender" id="F">
    </label>

    <label for="M">
        Male
        <input type="radio" value="Male" name="Gender" id="M">
    </label>

    <label for="O">
        Other
        <input type="radio" value="Other" name="Gender" id="O">
    </label>

    <br>

    <p>Course:</p>
    <input type="text" placeholder="Enter Course">
    <br>

    <label>
        Enter DOB:
        <input type="date" name="DOB">
    </label>
    <br>

    <p>Hobbies:</p>
    <input type="text" placeholder="Hobbies">
    <br>

    <p>Address</p>
    <input type="text" placeholder="Address">
    <br>

    <label>
        File:
        <input type="file" name="File">
    </label>
    <br>

    <label>
        <input type="submit" name="Submit">
    </label>

    <label>
        <input type="reset" name="Reset">
    </label>

</body>
</html>

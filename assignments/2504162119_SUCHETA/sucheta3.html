<!DOCTYPE html>
<html>
<head><title>Registration Form</title></head>
<body>
<h1>Student Registration Form</h1>
<form action="#" method="post">
  <label>Full Name</label><input type="text" name="fullname" required><br>
  <label>Email</label><input type="email" name="email" required><br>
  <label>Password</label><input type="password" name="password" required><br>
  <label>Gender</label>
  <input type="radio" name="gender" value="male"> Male
  <input type="radio" name="gender" value="female"> Female
  <input type="radio" name="gender" value="other"> Other<br>
  <label>Date of Birth</label><input type="date" name="dob"><br>
  <label>Course</label>
  <select name="course">
    <option>BCA</option><option>BSc CS</option><option>BCom</option>
  </select><br>
  <label>Hobbies</label>
  <input type="checkbox" value="reading"> Reading
  <input type="checkbox" value="sports"> Sports
  <input type="checkbox" value="music"> Music<br>
  <label>Address</label><textarea name="address"></textarea><br>
  <label>Upload Photo</label><input type="file" name="photo"><br>
  <button type="submit">Register</button>
  <button type="reset">Reset</button>
</form>
</body>
</html>

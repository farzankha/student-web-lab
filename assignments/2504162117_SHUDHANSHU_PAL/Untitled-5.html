<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <header>
        <h1>Student Registration Form</h1>
        <p>Register yourself by filling the form below.</p>
        <hr>
    </header>

    <main>

        <form>

            <fieldset>
                <legend><strong>Personal Information</strong></legend>

                <p>
                    <label for="name">Full Name:</label><br>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your full name" required>
                </p>

                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>
                </p>

                <p>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password"
                           placeholder="Create a password" required>
                </p>

                <p>
                    <label>Gender:</label><br>
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                </p>

                <p>
                    <label for="dob">Date of Birth:</label><br>
                    <input type="date" id="dob" name="dob" required>
                </p>

            </fieldset>

            <br>

            <fieldset>
                <legend><strong>Academic Information</strong></legend>

                <p>
                    <label for="course">Select Course:</label><br>
                    <select id="course" name="course" required>
                        <option value="">-- Select Course --</option>
                        <option value="bca">BCA</option>
                        <option value="mca">MCA</option>
                        <option value="bba">BBA</option>
                        <option value="ba">BA</option>
                    </select>
                </p>

                <p>
                    <label>Hobbies:</label><br>

                    <input type="checkbox" id="reading" name="hobby" value="Reading">
                    <label for="reading">Reading</label>

                    <input type="checkbox" id="music" name="hobby" value="Music">
                    <label for="music">Music</label>

                    <input type="checkbox" id="sports" name="hobby" value="Sports">
                    <label for="sports">Sports</label>

                    <input type="checkbox" id="gaming" name="hobby" value="Gaming">
                    <label for="gaming">Gaming</label>
                </p>

            </fieldset>

            <br>

            <fieldset>
                <legend><strong>Contact Information</strong></legend>

                <p>
                    <label for="address">Address:</label><br>
                    <textarea id="address" name="address"
                              rows="5" cols="40"
                              placeholder="Enter your complete address"
                              required></textarea>
                </p>

                <p>
                    <label for="file">Upload Document:</label><br>
                    <input type="file" id="file" name="file"
                           accept=".pdf,.jpg,.jpeg,.png">
                </p>

            </fieldset>

            <br>

            <input type="submit" value="Register">
            <input type="reset" value="Reset">

        </form>

    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Student Registration Portal</p>
    </footer>

</body>

</html>

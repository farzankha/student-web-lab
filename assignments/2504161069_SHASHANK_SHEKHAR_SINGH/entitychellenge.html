<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Special Characters</title></head>
<body>
<h1>Special Characters in HTML</h1>
<p>Less than: &lt;</p>
<p>Greater than: &gt;</p>
<p>Ampersand: &amp;</p>
<p>Quotation mark: &quot;Hello&quot;</p>
<p>Copyright: &copy; 2026</p>
<p>Registered mark: &reg;</p>
<p>Euro: &euro; and pound: &pound;</p>
<p>Not equal: &ne; and multiplication: &times;</p>
<p>Example tag text: &lt;h1&gt;Title&lt;/h1&gt;</p>
</body>
</html>

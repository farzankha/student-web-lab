<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College Event Gallery</title>
  <style>
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    figure {
      width: 250px;
      text-align: center;
    }
    figure img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    figcaption {
      font-size: 14px;
      color: #333;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>College Event Gallery</h1>
  <div class="gallery">
    <figure>
      <img src="dance.jpg" alt="Students performing a cultural dance on stage">
      <figcaption>Cultural Dance Performance</figcaption>
    </figure>
    <figure>
      <img src="debate.jpg" alt="Two students engaged in a debate competition">
      <figcaption>Debate Competition Finals</figcaption>
    </figure>
    <figure>
      <img src="sciencefair.jpg" alt="Student explaining a science project to visitors">
      <figcaption>Science Fair Exhibition</figcaption>
    </figure>
    <figure>
      <img src="music.jpg" alt="College band performing live music">
      <figcaption>Live Music by College Band</figcaption>
    </figure>
  </div>
</body>
</html>

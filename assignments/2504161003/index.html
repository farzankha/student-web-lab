<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Board</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#222;
    font-family:"Segoe UI Symbol","Arial Unicode MS",sans-serif;
}

.board{
    display:grid;
    grid-template-columns:repeat(8,80px);
    grid-template-rows:repeat(8,80px);
    border:6px solid #333;
}

.square{
    width:80px;
    height:80px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    user-select:none;
}

.white{
    background:#f0d9b5;
}

.black{
    background:#b58863;
}
</style>
</head>
<body>

<div class="board">

    <!-- Row 8 -->
    <div class="square white">♜</div>
    <div class="square black">♞</div>
    <div class="square white">♝</div>
    <div class="square black">♛</div>
    <div class="square white">♚</div>
    <div class="square black">♝</div>
    <div class="square white">♞</div>
    <div class="square black">♜</div>

    <!-- Row 7 -->
    <div class="square black">♟</div>
    <div class="square white">♟</div>
    <div class="square black">♟</div>
    <div class="square white">♟</div>
    <div class="square black">♟</div>
    <div class="square white">♟</div>
    <div class="square black">♟</div>
    <div class="square white">♟</div>

    <!-- Row 6 -->
    <div class="square white"></div>
    <div class="square black"></div>
    <div class="square white"></div>
    <div class="square black"></div>
    <div class="square white"></div>
    <div class="square black"></div>
    <div class="square white"></div>
    <div class="square black"></div>

    <!-- Row 5 -->
    <div class="square black"></div>
    <div class="square white"></div>
    <div class="square black"></div>
    <div class="square white"></div>
    <div class="square black"></div>
    <div class="square white"></div>
    <div class="square black"></div>
    <div class="square white"></div>

    <!-- Row 4 -->
    <div class="square white"></div>
    <div class="square black"></div>
    <div class="square white"></div>
    <div class="square black"></div>
    <div class="square white"></div>
    <div class="square black"></div>
    <div class="square white"></div>
    <div class="square black"></div>

    <!-- Row 3 -->
    <div class="square black"></div>
    <div class="square white"></div>
    <div class="square black"></div>
    <div class="square white"></div>
    <div class="square black"></div>
    <div class="square white"></div>
    <div class="square black"></div>
    <div class="square white"></div>

    <!-- Row 2 -->
    <div class="square white">♙</div>
    <div class="square black">♙</div>
    <div class="square white">♙</div>
    <div class="square black">♙</div>
    <div class="square white">♙</div>
    <div class="square black">♙</div>
    <div class="square white">♙</div>
    <div class="square black">♙</div>

    <!-- Row 1 -->
    <div class="square black">♖</div>
    <div class="square white">♘</div>
    <div class="square black">♗</div>
    <div class="square white">♕</div>
    <div class="square black">♔</div>
    <div class="square white">♗</div>
    <div class="square black">♘</div>
    <div class="square white">♖</div>

</div>

</body>
</html>

<html>
<head>
    <title>HTML Character Entities</title>
</head>

<body>

    <h1>HTML Character Entities</h1>

    <p>Copyright: &copy; 2026</p>

    <p>Registered: &reg;</p>

    <p>Trademark: &trade;</p>

    <p>Less than: &lt;</p>

    <p>Greater than: &gt;</p>

    <p>Ampersand: &amp;</p>

    <p>Double quotation: &quot;Hello World&quot;</p>

    <p>Single quotation: &apos;Hello World&apos;</p>

    <p>Plus or minus: &plusmn;</p>

    <p>Multiplication: &times;</p>

    <p>Division: &divide;</p>

    <p>Euro: &euro;</p>

</body>
</html>

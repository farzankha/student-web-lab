<!DOCTYPE html>
<html>
<head>
    <title>Character Entities</title>
</head>
<body>

<h1>HTML Character Entities</h1>

<p>Copyright: &copy;</p>
<p>Registered: &reg;</p>
<p>Trademark: &trade;</p>
<p>Less than: &lt;</p>
<p>Greater than: &gt;</p>
<p>Ampersand: &amp;</p>
<p>Quotation mark: &quot;</p>
<p>Single quotation: &apos;</p>
<p>Plus or minus: &plusmn;</p>
<p>Multiplication: &times;</p>
<p>Division: &divide;</p>
<p>Not equal: &ne;</p>
<p>Less than or equal: &le;</p>
<p>Greater than or equal: &ge;</p>

</body>
</html>

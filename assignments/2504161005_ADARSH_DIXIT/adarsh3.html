<html>
<head>

    <title>Student Registration Form</title>
</head>
<body>
    <h2>Student Registration Form</h2>
    <form action="/submit_registration" method="POST" enctype="multipart/form-data">
        <p>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required placeholder="Adarsh Dixit">
        </p>
        <p>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required placeholder="student@example.com">
        </p>
        <p>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required minlength="8">
        </p>
        <p>
            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob" required>
        </p>
        <p>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </p>
        <p>
            <label for="course">Select Course:</label><br>
            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option value="bca">BCA</option>
                <option value="btech">B.Tech CSE</option>
                <option value="bsc">B.Sc Computer Science</option>
                <option value="mca">MCA</option>
            </select>
        </p>
        <p>
            <label>Hobbies:</label><br>
            <input type="checkbox" id="coding" name="hobbies" value="coding">
            <label for="coding">Coding</label>
            <input type="checkbox" id="sports" name="hobbies" value="sports">
            <label for="sports">Sports</label>
            <input type="checkbox" id="music" name="hobbies" value="music">
            <label for="music">Music</label>
        </p>
        <p>
            <label for="address">Residential Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter full address..."></textarea>
        </p>
        <p>
            <label for="doc">Upload ID Proof (PDF/JPG):</label><br>
            <input type="file" id="doc" name="doc" accept=".pdf, .jpg, .jpeg, .png">
        </p>
        <p>
            <input type="submit" value="Register Student">
            <input type="reset" value="Clear Form">
        </p>
    </form>
</body>
</html>

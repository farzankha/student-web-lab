<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Panel</title>
    <style>
        .mainBox {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .navBar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            height: 103px;
        }

        .controls {
            margin-right: 5px;
        }

        .controls ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 25px;
            font-weight: 1000;
        }

        a {
            text-decoration: none;
            color: #1a3c6e;
        }

        a:hover {
            color: #d97706;
        }

        a:visited {
            color: #b91c1c;
        }
    </style>
</head>

<body>
    <div class="mainBox">
        <div class="navBar">
            <div class="logo">
                <img src="kmcluLogo.png" alt="Logo" class="logo">
            </div>
            <div class="controls">
                <ul>
                    <li><a href="https://kmclu.ac.in/" target="_blank">Home</a></li>
                    <li><a href="https://kmclu.ac.in/pages/about-us" target="_blank">About</a></li>
                    <li><a href="https://kmclu.ac.in/pages/course-offered" target="_blank">Courses</a></li>
                    <li><a href="https://kmclu.ac.in/pages/deans-of-faculties-director" target="_blank">Faculty</a></li>
                    <li><a href="#Labs">Labs</a></li>
                    <li><a href="#Assignments">Assignments</a></li>
                    <li><a href="https://kmclu.ac.in/pages/office-notices-and-circulars" target="_blank">Notices</a></li>
                    <li><a href="https://kmclu.ac.in/pages/image-gallery" target="_blank">Gallery</a></li>
                    <li><a href="https://kmclu.ac.in/pages/contact-directory" target="_blank">Contact</a></li>
                </ul>
            </div>
        </div>
    </div>
</body>

</html>

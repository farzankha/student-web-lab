<!DOCTYPE html>
<html lang="en">

<head>
    <title>Registration form</title>
</head>

<body>
    <h1 align="center" style="text-decoration: double underline; font-size: 50px;">Registration Form</h1>

    <form style="font-weight: 600; font-size: 25px;">
        <label for="name">Name:- </label>
        <input type="text" id="name">
        <br><br>

        <label for="email">Email:- </label>
        <input type="email" id="email">
        <br><br>

        <label for="password">Password:- </label>
        <input type="password" id="password">
        <br><br>

        Gender:-
        <label style="font-weight: 400;" for="male">Male</label>
        <input type="radio" id="male" name="Gender">

        <label style="font-weight: 400;" for="female">Female</label>
        <input type="radio" id="female" name="Gender">

        <label style="font-weight: 400;" for="other">Others</label>
        <input type="radio" id="other" name="Gender">
        <br><br>

        <label for="courses">Course:</label>
        <select name="course" id="courses">
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="B.Sc">B.Sc</option>
            <option value="M.Sc">M.Sc</option>
            <option value="B.Com">B.Com</option>
        </select>
        <br><br>

        <label for="DOB">Date Of Birth:- </label>
        <input type="date" name="DOB" id="DOB">
        <br><br>

        <p>Hobbies:-</p>

        <label for="hobby1">1.</label>
        <input type="text" id="hobby1" name="hobby1">
        <br>

        <label for="hobby2">2.</label>
        <input type="text" id="hobby2" name="hobby2">
        <br>

        <label for="hobby3">3.</label>
        <input type="text" id="hobby3" name="hobby3">
        <br>

        <label for="hobby4">4.</label>
        <input type="text" id="hobby4" name="hobby4">
        <br><br>

        <label for="Address">Address:-</label>
        <input type="text" name="Address" id="Address">
        <br><br>

        <label for="Image">Image:- </label>
        <input type="file" name="Image" id="Image">
        <br><br>

        <button type="submit">SUBMIT  </button>
        <button type="reset">RESET</button>

    </form>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Image Gallery</title>
</head>
<body>
    <h1 align="center" style="text-decoration: double underline; font-size: 50px;">Glimpses of the Event</h1>

    <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;">

        <figure>
            <img height="250px" width="400px" src="Doctor's day.jpg"
                alt="A doctor checking a student's blood pressure at the Faculty of Pharmacy's Doctor's Day event">
            <figcaption align="center">Doctor's Day Celebration — Faculty of Pharmacy, 1st July</figcaption>
        </figure>

        <figure>
            <img height="250px" width="400px" src="HarGharTiranga.jpg"
                alt="Students and staff holding the Indian national flag outside the university gate during the Har Ghar Tiranga march">
            <figcaption align="center">Har Ghar Tiranga March — Students and Staff Join In</figcaption>
        </figure>

        <figure>
            <img height="250px" width="400px" src="NCC.jpg"
                alt="NCC cadets standing in formation on stage during a parade ceremony">
            <figcaption align="center">NCC Cadets on Parade</figcaption>
        </figure>

        <figure>
            <img height="250px" width="400px" src="ProjectMela.jpg"
                alt="A student demonstrating a robotics project to guests at the Project Mela exhibition">
            <figcaption align="center">Project Mela — Students Showcasing Innovations</figcaption>
        </figure>

        <figure>
            <img height="250px" width="400px" src="SportsMeet.jpg"
                alt="Faculty greeting student athletes and a group photo with the basketball team at the Sports Meet">
            <figcaption align="center">Annual Sports Meet — Team Spirit in Action</figcaption>
        </figure>

        <figure>
            <img height="250px" width="400px" src="YogaDay.jpg"
                alt="A group of people performing yoga on mats laid out on the lawn during International Yoga Day">
            <figcaption align="center">International Yoga Day — Morning Session on Campus</figcaption>
        </figure>

    </div>
</body>
</html>

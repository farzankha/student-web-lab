<html> 
<head> 
<title>Registration Form</title> 
</head>
 <body> 
<h1>Student Registration Form</h1> 
<form>
 <!-- Name -->
 <label>Full Name:</label>
 <input type="text" name="name" placeholder="Enter your full name" required> <br><br> 
<!-- Email -->
 <label>Email:</label> 
<input type="email" name="email" placeholder="Enter your email" required> <br><br> 
<!-- Password --> 
<label>Password:</label> 
<input type="password" name="password" placeholder="Enter your password" required> <br><br>
 <!-- Gender -->
 <label>Gender:</label> 
<input type="radio" name="gender" value="male"> 
<label>Male</label> 
<input type="radio" name="gender" value="female"> 
<label>Female</label> 
<input type="radio" name="gender" value="other">
 <label>Other</label>
 <br><br>
 <!-- Phone -->
 <label>Phone Number:</label>
 <input type="tel" name="phone" placeholder="Enter phone number"> <br><br>
 <!-- Date of Birth --> 
<label>Date of Birth:</label>
 <input type="date" name="dob"> <br><br>
 <!-- Hobbies --> 
<label>Hobbies:</label> <br> 
<input type="checkbox" name="hobby" value="reading"> 
<label>Reading</label> 
<input type="checkbox" name="hobby" value="music"> 
<label>Listening to Music</label>
 <input type="checkbox" name="hobby" value="sports">
 <label>Sports</label>
 <input type="checkbox" name="hobby" value="coding"> 
<label>Coding</label> <br><br>
 <!-- Address --> 
<label>Address:</label> <br>
 <textarea name="address" rows="5" cols="40" placeholder="Enter your address">
</textarea> <br><br> 
<!-- File Upload -->
 <label>Upload Photo:</label> 
<input type="file" name="photo"> <br><br> 
<!-- Submit and Reset Buttons --> 
<input type="submit" value="Submit"> 
<input type="reset" value="Reset"> 
</form> 
</body>
 </html>

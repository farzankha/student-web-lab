<html>
<head>
    <title>College Event Image Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: blue;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        figure {
            background-color: white;
            padding: 10px;
            width: 250px;
            box-shadow: 0 0 5px gray;
        }

        img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        figcaption {
            margin-top: 8px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>

<body>

    <h1>College Event Image Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="college-event.jpg"
                 alt="Students attending the annual college cultural event">
            <figcaption>Annual College Cultural Event</figcaption>
        </figure>

        <figure>
            <img src="dance-performance.jpg"
                 alt="Students performing a group dance on the college stage">
            <figcaption>Dance Performance</figcaption>
        </figure>

        <figure>
            <img src="college-speech.jpg"
                 alt="Student giving a speech on stage during the college event">
            <figcaption>Student Speech</figcaption>
        </figure>

        <figure>
            <img src="prize-distribution.jpg"
                 alt="College teacher giving a prize to a student during the award ceremony">
            <figcaption>Prize Distribution</figcaption>
        </figure>

    </div>

</body>
</html>

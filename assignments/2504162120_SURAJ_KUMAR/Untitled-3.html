<!DOCTYPE html>
<html>

<head>
    <title>Registration</title>
</head>

<body>

<h2>Student Registration</h2>

<form>

<label>Name:</label>
<input type="text"><br><br>

<label>Email:</label>
<input type="email"><br><br>

<label>Password:</label>
<input type="password"><br><br>

<label>Gender:</label>

<input type="radio" name="g"> Male
<input type="radio" name="g"> Female

<br><br>

<label>Course:</label>

<select>
    <option>BCA</option>
    <option>BBA</option>
    <option>B.Com</option>
</select>

<br><br>

<label>DOB:</label>
<input type="date">

<br><br>

<label>Hobbies:</label>

<input type="checkbox"> Playing
<input type="checkbox"> Reading

<br><br>

<label>Address:</label>

<textarea></textarea>

<br><br>

<label>File:</label>
<input type="file">

<br><br>

<input type="submit">
<input type="reset">

</form>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>
</head>
<body>

<h1>University Student Registration Form</h1>

<form action="/submit-registration" method="post">

  <fieldset>
    <legend>Personal Details</legend>

    <label for="fullname">Full Name</label><br>
    <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name"><br><br>

    <label for="email">Email Address</label><br>
    <input type="email" id="email" name="email" required placeholder="you@example.com"><br><br>

    <label for="password">Password</label><br>
    <input type="password" id="password" name="password" required minlength="8"><br><br>

    <label for="dob">Date of Birth</label><br>
    <input type="date" id="dob" name="dob" required><br><br>

    <label>Gender</label><br>
    <input type="radio" id="male" name="gender" value="male"> <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female"> <label for="female">Female</label>
    <input type="radio" id="other" name="gender" value="other"> <label for="other">Other</label>
  </fieldset>

  <fieldset>
    <legend>Academic Details</legend>

    <label for="course">Course</label><br>
    <select id="course" name="course" required>
      <option value="">-- Select a course --</option>
      <option value="bca">BCA</option>
      <option value="bsc-cs">B.Sc Computer Science</option>
      <option value="btech">B.Tech</option>
      <option value="mca">MCA</option>
    </select><br><br>

    <label>Hobbies (select all that apply)</label><br>
    <input type="checkbox" id="reading" name="hobbies" value="reading"> <label for="reading">Reading</label>
    <input type="checkbox" id="sports" name="hobbies" value="sports"> <label for="sports">Sports</label>
    <input type="checkbox" id="coding" name="hobbies" value="coding"> <label for="coding">Coding</label>
    <input type="checkbox" id="music" name="hobbies" value="music"> <label for="music">Music</label>
  </fieldset>

  <fieldset>
    <legend>Address &amp; Documents</legend>

    <label for="address">Residential Address</label><br>
    <textarea id="address" name="address" rows="3" cols="40" placeholder="House no, street, city, state, PIN"></textarea><br><br>

    <label for="photo">Upload Photograph</label><br>
    <input type="file" id="photo" name="photo" accept="image/*">
  </fieldset>

  <br>
  <button type="submit">Submit Registration</button>
  <button type="reset">Reset Form</button>

</form>

</body>
</html>

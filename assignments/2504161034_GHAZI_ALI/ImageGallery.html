<!doctype html>
<html lang="en">
  <head>
    <title>College Event Image Gallery</title>
    <style>
      * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f4f6f8;
    color: #333;
    line-height: 1.6;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 10px;
}

body > p {
    text-align: center;
    color: #555;
    margin-bottom: 30px;
}

div {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
}

figure {
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    padding: 10px;
    width: 300px;
    text-align: center;
    transition: transform 0.2s ease;
}

figure:hover {
    transform: translateY(-5px);
}

figure img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 5px;
    display: block;
    background-color: #ddd;
}

figcaption {
    margin-top: 10px;
    font-size: 0.95rem;
    color: #2c3e50;
    font-weight: bold;
}
    </style>
  </head>

  <body>
    <h1>College Event Image Gallery</h1>

    <p>Some memorable moments from our college annual event.</p>

    <div>
     
      <figure>
        <img
          src="https://imgs.search.brave.com/CnFkcd2noMOGaq4XRSyrczkZKfZ0KNADRgfx9xahOIw/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pbWFn/ZS1zdGF0aWMuY29s/bGVnZWR1bmlhLmNv/bS9wdWJsaWMvcmV2/aWV3UGhvdG9zLzEw/Nzk5NjAvaW5ib3Vu/ZDc2NTk2ODQ4NDk3/MzkzMTQ0OS5qcGc"
          alt="College students attending the annual event in the campus"
          width="300"
        />
        <figcaption>Students enjoying the event.</figcaption>
      </figure>

      <figure>
        <img
          src="https://imgs.search.brave.com/R8e05P1qZ027c4u78rF3XzVfx4gEnS1OcxXcaygOzIY/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9rbWNs/dS5hYy5pbi9zdG9y/YWdlL2FwcC9wdWJs/aWMvc2xpZGVyLzE3/ODkxMzA1MTZfMTEw/OWttY2x1LmpwZw"
          alt="Chief guest giving a speech to students at the college event"
          width="300"
        />
        <figcaption>Chief guest addressing the students.</figcaption>
      </figure>

      <figure>
        <img
          src="https://imgs.search.brave.com/cZjn6Lw2qDw29XDSVShqXqrgkr5Z6reM1VVkci_2seU/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9wbGFj/ZW1lbnQua21jbHUu/YWMuaW4vYXNzZXRz/L2ltZy9jYXJvdXNl/bC83LndlYnA"
          alt="Students receiving certificates on stage after the college competition"
          width="300"
        />
        <figcaption>Students receiving their certificates.</figcaption>
      </figure>

       <figure>
        <img
          src=""
          alt="Students performing on stage during the college annual event"
          width="300"
        />
        <figcaption>Students performing on stage.</figcaption>
      </figure>

    </div>
  </body>
</html>
